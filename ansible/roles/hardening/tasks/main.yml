---
- name: Ensure security packages are installed
  apt:
    name:
      - ufw
      - fail2ban
      - iptables-persistent
    state: present
    update_cache: yes

- name: Secure SSH Configuration - Disable Root Login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present
  notify: Restart SSH

- name: Secure SSH Configuration - Disable Password Auth
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  notify: Restart SSH

- name: Set UFW firewall defaults (deny all incoming)
  ufw:
    direction: incoming
    policy: deny
  
- name: Set UFW firewall defaults (allow all outgoing)
  ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH traffic
  ufw:
    rule: limit
    port: '22'
    proto: tcp

- name: Allow HTTP traffic
  ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow HTTPS traffic
  ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: Enable UFW firewall
  ufw:
    state: enabled
