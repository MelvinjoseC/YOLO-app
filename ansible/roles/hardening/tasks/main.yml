---
- name: Ensure security packages are installed
  apt:
    name:
      - ufw
      - fail2ban
      - iptables-persistent
    state: present
    update_cache: yes

- name: Secure SSH Configuration - Disable Root Login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present
  notify: Restart SSH

- name: Secure SSH Configuration - Disable Password Auth
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  notify: Restart SSH

- name: Set UFW firewall defaults (deny all incoming)
  ufw:
    direction: incoming
    policy: deny
  
- name: Set UFW firewall defaults (allow all outgoing)
  ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH traffic
  ufw:
    rule: limit
    port: '22'
    proto: tcp

- name: Allow HTTP traffic
  ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow HTTPS traffic
  ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: Allow Prometheus Node Exporter metrics from monitoring subnet
  ufw:
    rule: allow
    port: '9100'
    proto: tcp

- name: Enable UFW firewall
  ufw:
    state: enabled

- name: Configure unattended-upgrades for automatic security updates
  apt:
    name: unattended-upgrades
    state: present

- name: Enable automatic security updates
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: '0644'

- name: Kernel parameter hardening via sysctl
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { key: 'net.ipv4.tcp_syncookies', value: '1' }
    - { key: 'net.ipv4.conf.all.rp_filter', value: '1' }
    - { key: 'net.ipv4.conf.default.accept_source_route', value: '0' }
