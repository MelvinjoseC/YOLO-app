groups:
  - name: yolo-api-alerts
    rules:
      - alert: HighHttpErrorRate
        expr: sum(rate(yolo_api_http_requests_total{code=~"5.."}[5m])) / sum(rate(yolo_api_http_requests_total[5m])) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate detected on {{ $labels.instance }}"
          description: "HTTP 5xx error rate is above 5% (current value: {{ $value }}%)"

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(yolo_api_http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency on {{ $labels.instance }}"
          description: "P95 request response time is above 500ms (current value: {{ $value }}s)"

      - alert: APIDown
        expr: up{job="yolo-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "YOLO API target {{ $labels.instance }} is down"
          description: "Scrape target is unreachable for more than 1 minute"

      - alert: DatabaseDown
        expr: probe_success{instance=~".*postgres.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL Database instance is unreachable"
          description: "Database health probe has failed for over 1 minute"

      - alert: KubePodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total{container="yolo-api"}[5m]) * 60 > 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"
          description: "Container has restarted more than 2 times in the last 5 minutes"

      - alert: HighMemoryUsage
        expr: container_memory_working_set_bytes{container="yolo-api"} / container_spec_memory_limit_bytes{container="yolo-api"} * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.container }} high memory utilization"
          description: "Memory utilization is above 85% of configured limit (current: {{ $value }}%)"

      - alert: PostgresConnectionPoolSaturated
        expr: pg_stat_activity_count / pg_settings_max_connections * 100 > 80
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection pool near saturation"
          description: "Active connections exceed 80% of max allowed connections"
