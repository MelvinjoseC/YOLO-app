global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'sre-team-webhook'
  routes:
    - match:
        severity: critical
      receiver: 'sre-pagerduty'
      continue: true
    - match:
        severity: warning
      receiver: 'sre-slack'

receivers:
  - name: 'sre-team-webhook'
    webhook_configs:
      - url: 'http://alertmanager-webhook.monitoring.svc:8080/alerts'
        send_resolved: true

  - name: 'sre-pagerduty'
    pagerduty_configs:
      - service_key: 'EXAMPLE_PAGERDUTY_SERVICE_KEY'
        send_resolved: true

  - name: 'sre-slack'
    slack_configs:
      - channel: '#alerts-yolo'
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'
