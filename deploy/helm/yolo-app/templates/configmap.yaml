apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yolo-app.fullname" . }}-config
  labels:
    {{- include "yolo-app.labels" . | nindent 4 }}
data:
  PORT: "{{ .Values.service.port }}"
  DB_HOST: "{{ .Values.database.host }}"
  DB_PORT: "{{ .Values.database.port }}"
  DB_NAME: "{{ .Values.database.name }}"
