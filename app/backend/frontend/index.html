<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOLO Task Board & Telemetry Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <header>
    <div class="nav-container">
      <div class="logo">
        YOLO Platform <span>DevOps Suite</span>
      </div>
      <div class="metrics-summary">
        <div class="metric-pill">
          <div id="db-indicator" class="dot unhealthy"></div>
          Database: <span id="db-status">Checking...</span>
        </div>
        <div class="metric-pill">
          API Status: <span id="api-status" style="color: var(--error-color);">Offline</span>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="sidebar">
      <div class="panel">
        <h2>Create New Task</h2>
        <form id="task-form">
          <div class="form-group">
            <label for="task-title">Title</label>
            <input type="text" id="task-title" placeholder="Deploy new microservice" required>
          </div>
          <div class="form-group">
            <label for="task-desc">Description</label>
            <textarea id="task-desc" rows="3" placeholder="Write dockerfile and build pipeline..." required></textarea>
          </div>
          <div class="form-group">
            <label for="task-status">Status</label>
            <select id="task-status">
              <option value="TODO">To Do</option>
              <option value="PROGRESS">In Progress</option>
              <option value="DONE">Done</option>
            </select>
          </div>
          <button type="submit" class="btn-primary">Add Task</button>
        </form>
      </div>

      <div class="panel">
        <h2>System Telemetry <span>Live</span></h2>
        <div class="stats-list">
          <div class="stat-item">
            <span class="stat-label">Total Requests</span>
            <span class="stat-value" id="stat-requests">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Error Rate (5xx)</span>
            <span class="stat-value" id="stat-errors" style="color: var(--accent-color);">0.0%</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">P95 Latency</span>
            <span class="stat-value" id="stat-latency">0ms</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Active Pods</span>
            <span class="stat-value" style="color: var(--primary-color);">3 replicas</span>
          </div>
        </div>
      </div>
    </div>

    <div class="board-container">
      <!-- TODO COLUMN -->
      <div class="board-column column-todo">
        <div class="column-header">
          <h3>To Do</h3>
          <span class="column-count" id="count-todo">0</span>
        </div>
        <div class="task-list" id="list-todo">
          <!-- Tasks injected via JS -->
        </div>
      </div>

      <!-- IN PROGRESS COLUMN -->
      <div class="board-column column-progress">
        <div class="column-header">
          <h3>In Progress</h3>
          <span class="column-count" id="count-progress">0</span>
        </div>
        <div class="task-list" id="list-progress">
          <!-- Tasks injected via JS -->
        </div>
      </div>

      <!-- DONE COLUMN -->
      <div class="board-column column-done">
        <div class="column-header">
          <h3>Done</h3>
          <span class="column-count" id="count-done">0</span>
        </div>
        <div class="task-list" id="list-done">
          <!-- Tasks injected via JS -->
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>YOLO Cloud-Native App • Engineered with modern DevOps & SRE Best Practices</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
